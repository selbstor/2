<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciar Produtos — Selbstor|Achadinhos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6fa; color: #2c3e50;
  }
  .admin-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; padding: 20px 30px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
  }
  .admin-header h1 { font-size: 1.5rem; }
  .admin-main { padding: 20px 30px; max-width: 1400px; margin: 0 auto; }
  .toolbar {
    display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; background: white;
  }
  .toolbar input { flex: 1; min-width: 200px; }
  .btn {
    padding: 10px 18px; border: none; border-radius: 8px;
    background: white; color: #333; cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all .2s;
  }
  .btn:hover { background: #eee; }
  .btn-primary { background: #667eea; color: white; }
  .btn-primary:hover { background: #5568d3; }
  .btn-danger { background: #e74c3c; color: white; }
  .btn-danger:hover { background: #c0392b; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-icono {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; padding: 0; position: relative;
  }
  .btn-icono::after {
    content: attr(title);
    position: absolute; bottom: 120%; left: 50%;
    transform: translateX(-50%);
    background: #2c3e50; color: white;
    padding: 5px 10px; border-radius: 6px;
    font-size: 12px; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
    z-index: 10;
  }
  .btn-icono:hover::after { opacity: 1; }
  .btn-icono.btn-danger::after { background: #e74c3c; }
  .tabela-wrap {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: #f8f9fa; padding: 14px; text-align: left;
    font-size: 13px; text-transform: uppercase; color: #666;
    border-bottom: 2px solid #eee;
  }
  td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  tr:hover { background: #fafbff; }
  td img {
    width: 50px; height: 50px; object-fit: cover;
    border-radius: 6px; background: #f0f0f0;
  }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .badge-sim { background: #d4edda; color: #155724; }
  .badge-nao { background: #f8d7da; color: #721c24; }
  .badge-destaque { background: #fff3cd; color: #856404; }
  .acoes { display: flex; gap: 6px; }
  .vazio { text-align: center; padding: 40px; color: #999; }

  /* Modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal.oculto { display: none; }
  .modal-conteudo {
    background: white; border-radius: 12px; width: 100%; max-width: 600px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-header {
    padding: 20px 24px; border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn-fechar {
    background: none; border: none; font-size: 24px;
    cursor: pointer; color: #999;
  }
  #formProduto { padding: 24px; }
  .campo { margin-bottom: 16px; }
  .campo label {
    display: block; margin-bottom: 6px;
    font-size: 13px; font-weight: 600; color: #555;
  }
  .campo input, .campo textarea, .campo select {
    width: 100%; padding: 10px 12px;
    border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; font-family: inherit;
  }
  .campo input:focus, .campo textarea:focus, .campo select:focus {
    outline: none; border-color: #667eea;
  }
  .linha-dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .linha-tripla { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  #formProduto h3 {
    font-size: 14px; font-weight: 600; margin: 20px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid #eee;
    color: #667eea;
  }
  .botoes-form {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; right: 30px;
    background: #2c3e50; color: white;
    padding: 14px 22px; border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    z-index: 2000; animation: slideIn .3s;
  }
  .toast.sucesso { background: #27ae60; }
  .toast.erro { background: #e74c3c; }
  .toast.oculto { display: none; }
  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  @media (max-width: 700px) {
    .admin-header { flex-direction: column; gap: 10px; align-items: stretch; }
    .linha-dupla, .linha-tripla { grid-template-columns: 1fr; }
    th:nth-child(1), td:nth-child(1) { display: none; }
  }
</style>
</head>
<body>
  <header class="admin-header">
    <h1>🛍️ Gerenciar Achadinhos</h1>
    <button id="btnNovo" class="btn btn-primary">+ Novo Produto</button>
  </header>

  <main class="admin-main">
    <div class="toolbar">
      <input type="text" id="busca" placeholder="🔍 Buscar produto...">
      <select id="filtroStatus">
        <option value="">Todos os status</option>
        <option value="Sim">Ativos</option>
        <option value="Não">Inativos</option>
      </select>
      <button id="btnRecarregar" class="btn">🔄 Recarregar</button>
    </div>

    <div id="tabelaWrap" class="tabela-wrap">
      <table id="tabelaProdutos">
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Destaque</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <tr><td colspan="7" class="vazio">Carregando produtos...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal oculto">
    <div class="modal-conteudo">
      <div class="modal-header">
        <h2 id="modalTitulo">Novo Produto</h2>
        <button class="btn-fechar" onclick="fecharModal()">✕</button>
      </div>
      <form id="formProduto">
        <input type="hidden" id="campoLinha">

        <h3> Dados principais</h3>
        <div class="campo">
          <label>Nome do produto *</label>
          <input type="text" id="nome" required>
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label>Tipo</label>
            <input type="text" id="tipo" placeholder="Ex: Físico ou Digital">
          </div>
          <div class="campo">
            <label>Plataforma</label>
            <input type="text" id="plataforma" placeholder="Ex: Shopee, Amazon">
          </div>
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label>Categoria</label>
            <input type="text" id="categoria" placeholder="Ex: Casa, Eletrônicos">
          </div>
          <div class="campo">
            <label>Subcategoria</label>
            <input type="text" id="subcategoria" placeholder="Ex: Cozinha, Áudio">
          </div>
        </div>

        <div class="linha-dupla">
        <div class="campo">
            <label>Validade da oferta</label>
            <input type="text" id="validade" placeholder="31/12/2026">
          </div>
        </div>

        <h3>🔗 Link e botão</h3>
        <div class="campo">
          <label>Link de Afiliado *</label>
          <input type="url" id="link" required placeholder="https://...">
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label>Texto do Botão</label>
            <input type="text" id="textoBotao" placeholder="Compre na Amazon">
          </div>
        </div>

        <h3>🖼️ Imagens</h3>
        <div class="campo">
          <label>Imagem 1 (principal) *</label>
          <input type="url" id="imagem1" required placeholder="https://...">
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label>Imagem 2</label>
            <input type="url" id="imagem2">
          </div>
          <div class="campo">
            <label>Imagem 3</label>
            <input type="url" id="imagem3">
          </div>
        </div>
        <div class="campo">
          <label>Imagem 4</label>
          <input type="url" id="imagem4">
        </div>

        <h3>⚙️ Configurações</h3>
        <div class="linha-tripla">
          <div class="campo">
            <label>Ordem</label>
            <input type="number" id="ordem" placeholder="1">
          </div>
          <div class="campo">
            <label>Destaque?</label>
            <select id="destaque">
              <option value="Não">Não</option>
              <option value="Sim">Sim</option>
            </select>
          </div>
          <div class="campo">
            <label>Ativo?</label>
            <select id="ativo">
              <option value="Sim">Sim</option>
              <option value="Não">Não</option>
            </select>
          </div>
        </div>

        <div class="botoes-form">
          <button type="button" class="btn" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">💾 Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast oculto"></div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
