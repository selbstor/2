<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selfstor | Achadinhos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #333;
    min-height: 100vh;
  }
  header {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color: white;
    padding: 30px 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  header h1 { font-size: 2rem; margin-bottom: 8px; font-weight: 700; }
  header p { opacity: 0.95; font-size: 1rem; font-weight: 300; }
  .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
  
  .filtros-categoria {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 30px;
    padding: 15px 20px;
    background: white;
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    justify-content: center;
  }
  .btn-cat {
    padding: 10px 20px;
    border: 2px solid #e0e0e0;
    background: white;
    border-radius: 25px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.3s;
    color: #555;
  }
  .btn-cat:hover { background: #f5f5f5; border-color: #667eea; }
  .btn-cat.ativo {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-color: #667eea;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
  }
  
  .secao-titulo {
    font-size: 1.4rem;
    margin: 35px 0 20px;
    color: white;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s, box-shadow 0.3s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  }
  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #f8f9fa;
  }
  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, #667eea20, #764ba220);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: #667eea;
  }
  .card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .card-nome {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #2c3e50;
    line-height: 1.4;
  }
  .card-categoria {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 10px;
  }
  .card-validade {
    font-size: 0.8rem;
    color: #e74c3c;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .card-acoes {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  .btn-oferta {
    flex: 1;
    padding: 12px;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s;
  }
  .btn-oferta:hover { 
    background: linear-gradient(135deg, #229954, #27ae60);
    box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
  }
  .btn-compartilhar {
    padding: 12px 14px;
    background: #ecf0f1;
    color: #2c3e50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s;
  }
  .btn-compartilhar:hover { background: #d5dbdb; }
  
  .vazio {
    text-align: center;
    padding: 60px 20px;
    color: white;
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    font-size: 1.1rem;
  }
  .erro-box {
    text-align: center;
    padding: 60px 20px;
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    color: #856404;
  }
  .erro-box h2 { margin-bottom: 15px; color: #e74c3c; }
  .erro-box button {
    margin-top: 20px;
    padding: 12px 30px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  footer {
    text-align: center;
    padding: 30px 20px;
    color: white;
    margin-top: 50px;
  }
  footer a { color: white; text-decoration: none; }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #2c3e50;
    color: white;
    padding: 14px 28px;
    border-radius: 50px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.visivel { opacity: 1; }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #667eea;
  }
  .loading i { font-size: 3rem; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1><i class="fas fa-shopping-bag"></i> Selbstor | Achadinhos</h1>
  <p>As melhores ofertas selecionadas para você</p>
</header>

<div class="container">
  <div id="conteudo">
    <div class="loading">
      <i class="fas fa-spinner"></i>
      <p>Carregando achadinhos...</p>
    </div>
  </div>
</div>

<footer>
  Feito com <i class="fas fa-heart"></i> por <a href="https://selbstor.com/" target="_blank">Selbstor | Achadinhos</a>
</footer>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script>
let produtos = [];
let categoriaAtiva = 'Todos';

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function get(p, ...nomes) {
  for (const nome of nomes) {
    for (const chave of Object.keys(p)) {
      if (chave.startsWith('_')) continue;
      const nChave = chave.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
      const nNome = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
      if (nChave === nNome) return p[chave];
    }
  }
  return '';
}

function parseCSV(texto) {
  const linhas = texto.split(/\r?\n/);
  if (linhas.length < 2) return [];
  let idx = -1;
  for (let i = 0; i < linhas.length; i++) {
    if (linhas[i].toLowerCase().includes('ativo') && linhas[i].toLowerCase().includes('nome')) {
      idx = i; break;
    }
  }
  if (idx === -1) idx = 0;
  const cabecalhos = parseLinhaCSV(linhas[idx]);
  return linhas.slice(idx + 1).filter(l => l.trim()).map(l => {
    const cols = parseLinhaCSV(l);
    const obj = {};
    cabecalhos.forEach((h, c) => { obj[h.trim()] = cols[c] || ''; });
    return obj;
  });
}

function parseLinhaCSV(linha) {
  const res = []; let atual = '', aspas = false;
  for (let i = 0; i < linha.length; i++) {
    const c = linha[i], prox = linha[i+1];
    if (aspas) {
      if (c === '"' && prox === '"') { atual += '"'; i++; }
      else if (c === '"') aspas = false;
      else atual += c;
    } else {
      if (c === '"') aspas = true;
      else if (c === ',') { res.push(atual.trim()); atual = ''; }
      else atual += c;
    }
  }
  res.push(atual.trim()); return res;
}

async function carregar() {
  const conteudo = document.getElementById('conteudo');
  try {
    if (typeof ACHADINHOS === 'undefined') throw new Error('Configuração não carregada');
    const resp = await fetch(ACHADINHOS.planilha_catalogo + '&t=' + Date.now(), {
      method: 'GET', mode: 'cors', cache: 'no-cache'
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    let texto = await resp.text();
    if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
    produtos = parseCSV(texto).filter(p => get(p, 'Ativo') === 'Sim');
    renderizar();
  } catch (e) {
    console.error('Erro:', e);
    conteudo.innerHTML = `
      <div class="erro-box">
        <h2><i class="fas fa-exclamation-triangle"></i> Ops! Não foi possível carregar</h2>
        <p>Verifique se a planilha está publicada e o config.js configurado.</p>
        <button onclick="carregar()"><i class="fas fa-sync-alt"></i> Tentar novamente</button>
      </div>
    `;
  }
}

function renderizar() {
  const conteudo = document.getElementById('conteudo');
  if (!produtos.length) {
    conteudo.innerHTML = '<div class="vazio"><i class="fas fa-box-open fa-3x"></i><br><br>Nenhum produto disponível.</div>';
    return;
  }

  const ordenados = [...produtos].sort((a, b) => {
    const oa = parseInt(get(a, 'Ordem')) || 9999;
    const ob = parseInt(get(b, 'Ordem')) || 9999;
    if (oa !== ob) return oa - ob;
    return (get(a, 'Nome') || '').localeCompare(get(b, 'Nome') || '');
  });

  const destaques = ordenados.filter(p => get(p, 'Destaque') === 'Sim');
  const categorias = ['Todos', ...new Set(ordenados.map(p => get(p, 'Categoria')).filter(Boolean))];
  const filtrados = categoriaAtiva === 'Todos' ? ordenados : ordenados.filter(p => get(p, 'Categoria') === categoriaAtiva);

  let html = '';
  html += `<div class="filtros-categoria">`;
  categorias.forEach(cat => {
    const ativa = cat === categoriaAtiva ? 'ativo' : '';
    html += `<button class="btn-cat ${ativa}" onclick="filtrarCategoria('${escapeHtml(cat)}')">${escapeHtml(cat)}</button>`;
  });
  html += `</div>`;

  if (categoriaAtiva === 'Todos' && destaques.length > 0) {
    html += `<h2 class="secao-titulo"><i class="fas fa-star"></i> Destaques</h2>`;
    html += `<div class="grid">${destaques.map(renderCard).join('')}</div>`;
  }

  html += `<h2 class="secao-titulo"><i class="fas fa-shopping-cart"></i> ${categoriaAtiva === 'Todos' ? 'Todos os Achadinhos' : escapeHtml(categoriaAtiva)}</h2>`;
  if (!filtrados.length) {
    html += `<div class="vazio"><i class="fas fa-search fa-3x"></i><br><br>Nenhum produto nesta categoria.</div>`;
  } else {
    html += `<div class="grid">${filtrados.map(renderCard).join('')}</div>`;
  }

  conteudo.innerHTML = html;
}

function renderCard(p) {
  const nome = get(p, 'Nome') || 'Produto';
  const img = (get(p, 'Imagem 1') || get(p, 'Imagem') || '').trim();
  const cat = get(p, 'Categoria') || '';
  const validade = get(p, 'Validade da oferta') || '';
  const link = (get(p, 'Link de Afiliado') || get(p, 'Link') || '#').trim();

  const imgHtml = img
    ? `<img class="card-img" src="${escapeHtml(img)}" alt="${escapeHtml(nome)}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
       <div class="card-img-placeholder" style="display:none"><i class="fas fa-image"></i></div>`
    : `<div class="card-img-placeholder"><i class="fas fa-image"></i></div>`;

  const validadeHtml = validade ? `<div class="card-validade"><i class="fas fa-clock"></i> ${escapeHtml(validade)}</div>` : '';

  return `
    <div class="card">
      ${imgHtml}
      <div class="card-body">
        <div class="card-nome">${escapeHtml(nome)}</div>
        ${cat ? `<div class="card-categoria"><i class="fas fa-tag"></i> ${escapeHtml(cat)}</div>` : ''}
        ${validadeHtml}
        <div class="card-acoes">
          <a href="${escapeHtml(link)}" target="_blank" rel="noopener" class="btn-oferta" onclick="registrarClique('${escapeHtml(nome)}')"><i class="fas fa-external-link-alt"></i> Ver oferta</a>
          <button class="btn-compartilhar" onclick="compartilhar('${escapeHtml(nome)}', '${escapeHtml(link)}')" title="Compartilhar"><i class="fas fa-share-alt"></i></button>
        </div>
      </div>
    </div>
  `;
}

function filtrarCategoria(cat) {
  categoriaAtiva = cat;
  renderizar();
}

async function registrarClique(nome) {
  try {
    const dados = { acao: 'clique', produto: nome, data: new Date().toISOString() };
    const url = `${ACHADINHOS.registrar_cliques}?data=${encodeURIComponent(JSON.stringify(dados))}`;
    await fetch(url, { method: 'GET' });
  } catch (e) { console.warn('Falha ao registrar clique:', e); }
}

function compartilhar(nome, link) {
  const texto = `Olha esse achadinho: ${nome}\n${link}`;
  if (navigator.share) {
    navigator.share({ title: nome, text: texto, url: link }).catch(() => {});
  } else {
    navigator.clipboard.writeText(texto).then(() => {
      mostrarToast('<i class="fas fa-check"></i> Link copiado!');
    }).catch(() => {
      mostrarToast('<i class="fas fa-times"></i> Não foi possível copiar');
    });
  }
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('visivel');
  setTimeout(() => t.classList.remove('visivel'), 2500);
}

carregar();
</script>
</body>
</html>
